name: Aggiorna partite Inter

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il sito
        uses: actions/checkout@v4

      - name: Scarica le partite
        env:
          API_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          curl -fsS \
            -H "X-Auth-Token: $API_TOKEN" \
            "https://api.football-data.org/v4/teams/108/matches?limit=20" \
            -o inter-matches.json

      - name: Salva gli aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inter-matches.json
          git diff --cached --quiet || (
            git commit -m "Aggiorna partite Inter"
            git push
          )    
